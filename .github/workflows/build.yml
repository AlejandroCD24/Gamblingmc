name: Compilar plugin

on:
  push:
  workflow_dispatch:
    inputs:
      spigot_version:
        description: "Versión de la API de Spigot (la de tu servidor)"
        required: true
        default: "26.3-R0.1-SNAPSHOT"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Buscar el proyecto (carpetas o .zip)
        run: |
          POM=$(find . -name pom.xml -not -path "*/target/*" | head -n 1)
          if [ -z "$POM" ]; then
            ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No encontré pom.xml ni un archivo .zip. Sube MobApostador.zip al repositorio."
              exit 1
            fi
            echo "Descomprimiendo $ZIP"
            unzip -q -o "$ZIP" -d proyecto_zip
            POM=$(find proyecto_zip -name pom.xml -not -path "*/target/*" | head -n 1)
            if [ -z "$POM" ]; then
              echo "::error::El archivo $ZIP no tiene pom.xml adentro."
              exit 1
            fi
          fi
          echo "PROYECTO=$(dirname "$POM")" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $(dirname "$POM")"

      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Compilar con Maven
        run: mvn -B package -f "$PROYECTO/pom.xml" -Dspigot.version="${{ github.event.inputs.spigot_version || '26.3-R0.1-SNAPSHOT' }}"

      - name: Subir el .jar
        uses: actions/upload-artifact@v6
        with:
          name: MobApostador
          path: ${{ env.PROYECTO }}/target/MobApostador-*.jar
          if-no-files-found: error
