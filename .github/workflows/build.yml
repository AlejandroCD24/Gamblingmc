name: Compilar plugin

on:
  push:
  workflow_dispatch:
    inputs:
      spigot_version:
        description: "Versión de la API de Spigot (la de tu servidor)"
        required: true
        default: "26.3-R0.1-SNAPSHOT"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compilar con Maven
        run: mvn -B package -Dspigot.version="${{ github.event.inputs.spigot_version || '26.3-R0.1-SNAPSHOT' }}"
      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: MobApostador
          path: target/MobApostador-*.jar
